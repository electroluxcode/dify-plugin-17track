identity:
  name: delete_trackings
  author: electroluxcode
  label:
    en_US: Delete Trackings
    zh_Hans: 删除跟踪单号
description:
  human:
    en_US: Permanently delete up to 40 registered tracking numbers; deleted shipments cannot be restored
    zh_Hans: 永久删除最多 40 个已注册单号,删除后不可恢复
  llm: Permanently deletes up to 40 registered tracking numbers (comma, semicolon or newline separated). Deleted shipments cannot be restored. Read-write, destructive operation.
parameters:
  - name: numbers
    type: string
    required: true
    label:
      en_US: Tracking Numbers
      zh_Hans: 跟踪单号
    human_description:
      en_US: Registered tracking numbers, comma or newline separated (max 40)
      zh_Hans: 已注册的跟踪单号,逗号或换行分隔(最多 40 个)
    llm_description: Registered tracking numbers to permanently delete, comma, semicolon or newline separated, maximum 40
    form: llm
output_schema:
  type: object
  properties:
      accepted:
        type: array[object]
        label:
          en_US: Items accepted and processed by 17TRACK
          zh_Hans: 被 17TRACK 接受的条目
      rejected:
        type: array[object]
        label:
          en_US: Items rejected by 17TRACK with error details
          zh_Hans: 被拒绝的条目及原因
extra:
  python:
    source: tools/delete_trackings.py
